<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Job Wala - Latest Government Jobs, Results & Admit Card</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sarkari Result Style Custom CSS */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        header { background-color: #000080; color: white; text-align: center; padding: 15px 0; }
        header h1 { margin: 0; font-size: 28px; }
        nav { background-color: #ff0000; display: flex; justify-content: center; flex-wrap: wrap; }
        nav a { color: white; text-decoration: none; padding: 10px 15px; font-weight: bold; font-size: 14px; }
        nav a:hover { background-color: #b30000; }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 10px; display: flex; flex-wrap: wrap; gap: 20px; }
        .box { flex: 1; min-width: 300px; background: white; border: 2px solid #000080; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .heading { background-color: #000080; color: white; padding: 10px; text-align: center; font-size: 18px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px; border-bottom: 1px solid #ddd; font-size: 14px; }
        tr:hover { background-color: #f9f9f9; }
        
        /* Links Style */
        .job-link { color: #ff0000; text-decoration: none; font-weight: bold; }
        .job-link:hover { text-decoration: underline; color: #000080; }
        .btn-view { background-color: #000080; color: white; padding: 4px 10px; text-decoration: none; border-radius: 3px; font-size: 12px; font-weight: bold; }
        .btn-view:hover { background-color: #ff0000; }
        
        footer { background-color: #000080; color: white; text-align: center; padding: 15px; margin-top: 30px; }
    </style>
</head>

<body>

<header>
    <h1>My Job Wala</h1>
    <p>Latest Jobs | Results | Admit Card | Answer Key</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="jobs.html">Latest Jobs</a>
    <a href="result.html">Results</a>
    <a href="admit-card.html">Admit Card</a>
    <a href="answer-key.html">Answer Key</a>
</nav>

<div class="container">

    <!-- 1. Latest Jobs Section -->
    <div class="box">
        <div class="heading">Latest Jobs</div>
        <table>
            <tbody id="Latest Jobs"></tbody>
        </table>
    </div>

    <!-- 2. Result Section -->
    <div class="box">
        <div class="heading">Results</div>
        <table>
            <tbody id="Result"></tbody>
        </table>
    </div>

    <!-- 3. Admit Card Section -->
    <div class="box">
        <div class="heading">Admit Card</div>
        <table>
            <tbody id="Admit Card"></tbody>
        </table>
    </div>

</div>

<footer>

</footer>

<script src="posts.js"></script>

</body>
</html>
